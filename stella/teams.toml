# Generic team archetypes that ship with the core. Extensions add their own.
# Each entry points at the team's interface; see `stella team <name>`.
# `keep_open = true` exempts a team from the automatic wrap-up sweep (the owner keeps talking to its session).

[team.builder]
summary = "Builds or changes a tool, script, service or piece of personal infrastructure, end to end: plan, implement, test, commit locally."
when = "The owner asks for something to be built or changed in code, and no more specific team fits."
launch = "/stella:build {order}"
skill_file = "plugin/skills/build/SKILL.md"
correct = "Type to the lead in its window, or `stella tell <name> \"...\"`. Corrections about how builders should work go to the stella-curator."
read_only = false

[team.investigator]
summary = "Investigates a question, bug or incident across code, logs and documents, and returns a sourced answer. Changes nothing."
when = "The owner asks why something happens, how something works, or to debug or research something, and the answer needs real digging."
launch = "/stella:investigate {order}"
skill_file = "plugin/skills/investigate/SKILL.md"
correct = "Type to the lead in its window, or `stella tell <name> \"...\"`."
read_only = true
