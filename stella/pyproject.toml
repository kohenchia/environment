[project]
name = "stella"
version = "0.1.0"
description = "Stella: a chief-of-staff layer for Claude Code sessions"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
stella = "stella.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stella"]

[tool.pytest.ini_options]
testpaths = ["tests"]
