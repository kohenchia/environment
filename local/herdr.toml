# herdr: the terminal multiplexer for the work window (Work Env 3.0). Linked by setup.sh to
# ~/.config/herdr/config.toml. tmux stays configured (local/.tmux.conf, `twt`) as the fallback.
#
# Keys: Alacritty turns Cmd chords into ESC byte strings (local/alacritty.toml, unchanged), and herdr
# decodes them as alt+... chords, so the Cmd keys from tmux carry over as direct (prefix-free) bindings.
# Three tmux chords have no herdr action: Cmd+0 (last tab), Cmd+Shift+Space (next layout) and
# Cmd+Shift+B (the off-switch for a nested tmux over ssh).

onboarding = false

[update]
# No background calls home: upgrades are deliberate (from the package manager).
version_check = false
manifest_check = false

[keys]
prefix = "ctrl+b"
detach = ["prefix+q", "prefix+d"]

# Windows (herdr: tabs; Cmd+1..9, Cmd+Shift+{ }, Cmd+Ctrl+Shift+arrows, Cmd+T, Cmd+Shift+R)
switch_tab        = "alt+1..9"
previous_tab      = "alt+shift+left"
next_tab          = "alt+shift+right"
move_tab_previous = "ctrl+alt+shift+left"
move_tab_next     = "ctrl+alt+shift+right"
new_tab           = "alt+t"
rename_tab        = "alt+shift+r"
close_tab         = ""             # Cmd+W closes a pane, and a window goes with its last pane

# Spaces (projects): Cmd+Shift+Up / Down walk them in order, Cmd+Shift+W closes one (herdr asks first; its
# sessions keep running), Cmd+Shift+N opens a new project (the popup below). Cmd+Shift+R on a project's first
# window renames the project.
previous_workspace = "alt+up"
next_workspace     = "alt+down"
close_workspace    = "alt+shift+w"

# Panes (Cmd+D / Cmd+Shift+D, Cmd+Shift+arrows focus, Cmd+Opt+arrows swap, Cmd+Ctrl+arrows resize,
# Cmd+Shift+Enter zoom, Cmd+W close, Cmd+R rename, Cmd+K clear, Cmd+F search)
split_vertical    = "alt+d"
split_horizontal  = "alt+shift+d"
focus_pane_left   = ["prefix+h", "alt+left"]
focus_pane_down   = "prefix+j"     # (Cmd+Shift+Up / Down moved to the spaces)
focus_pane_up     = "prefix+k"
focus_pane_right  = ["prefix+l", "alt+right"]
swap_pane_left    = ["prefix+shift+h", "ctrl+shift+left"]
swap_pane_down    = ["prefix+shift+j", "ctrl+shift+down"]
swap_pane_up      = ["prefix+shift+k", "ctrl+shift+up"]
swap_pane_right   = ["prefix+shift+l", "ctrl+shift+right"]
resize_pane_left  = "ctrl+alt+left"
resize_pane_down  = "ctrl+alt+down"
resize_pane_up    = "ctrl+alt+up"
resize_pane_right = "ctrl+alt+right"
zoom              = ["prefix+z", "alt+z"]
close_pane        = ["prefix+x", "alt+w"]
rename_pane       = "alt+r"
clear_pane        = "alt+k"
copy_mode         = ["prefix+[", "alt+/"]

# Cmd+Shift+N: ask for a name and open the project's space (the helper registers it with Stella as well).
[[keys.command]]
key = "alt+shift+n"
type = "popup"
command = "stella project new --ask"
width = 50
height = 5

[ui]
tab_bar_position = "top"
sidebar_start_collapsed = false   # the sidebar is the live view of every agent's state
prompt_new_tab_name = false
mouse_capture = true
status_indicators = "dots"         # one filled shape for blocked/working/done; the colour tells them apart
sidebar_width = 40                # "└ <project> · <crewmate>" labels are long; the default 26 truncates them

# Dots show Claude's own state of each session, copied onto the window's pane by `stella crew follow`:
# yellow = awaiting input (herdr's `blocked`, which its theme draws with `red`), blue = working (`yellow`),
# green filled = finished and not yet looked at (`done`), hollow = seen. `dots` draws one filled shape for all
# three; only the colour differs. The theme override recolours exactly these state marks.
[theme.custom]
red = "#f9e2af"
yellow = "#89b4fa"

# The sidebar is herdr's own. Spaces (one per project, Stella's first): the state icon of its most urgent
# window, the project name and, when windows wait for you, how many ($need, written by the reporter). Agents:
# the active space's agents only (the reporter sets the view), each with the one line it needs under its name
# (the pane title the reporter writes).
[ui.sidebar.spaces]
rows = [["state_icon", "workspace", "$need"]]

[ui.sidebar.agents]
rows = [["state_icon", "tab"], ["terminal_title_stripped"]]

# A herdr server restart must not resume the crew tabs' Claude panes into their own conversation: the sessions
# belong to the Claude daemon, and `stella crew sync` (run by `tw`) re-attaches them instead.
[session]
resume_agents_on_restore = false
