# herdr: the terminal multiplexer for the work window. Linked by setup.sh to ~/.config/herdr/config.toml.
# A space (herdr: workspace) per project; a window (herdr: tab) per session or tool; panes inside a window.
#
# Keys: Alacritty turns each Cmd chord into an ESC byte string (local/alacritty.toml), which herdr reads as an
# alt+... chord, so every Cmd chord from the tmux days carries over as a direct (prefix-free) binding.
# Cmd+0 (last window), Cmd+Shift+Space (next layout) and Cmd+Shift+B (the nested-tmux off-switch) have no
# herdr action. docs/herdr.md has the full table.

onboarding = false

[update]
# No background calls home: upgrades are deliberate (from the package manager).
version_check = false
manifest_check = false

[keys]
prefix = "ctrl+b"
detach = ["prefix+q", "prefix+d"]

# Windows: Cmd+1..9, Cmd+Shift+{ }, Cmd+Ctrl+Shift+Left/Right move one, Cmd+T new, Cmd+Shift+R rename.
# Cmd+W closes a pane, and a window goes with its last pane; Cmd+Shift+W closes the window outright.
switch_tab        = "alt+1..9"
previous_tab      = "alt+shift+left"
next_tab          = "alt+shift+right"
move_tab_previous = "ctrl+alt+shift+left"
move_tab_next     = "ctrl+alt+shift+right"
new_tab           = "alt+t"
rename_tab        = "alt+shift+r"
close_tab         = "alt+shift+w"

# Spaces: the Ctrl layer, with Shift meaning "move" as for windows.
#   Cmd+N                 new space (a blank terminal)
#   Cmd+Ctrl+Up / Down    go to the space above / below
#   Cmd+Ctrl+Shift+Up/Down move this space up / down (the command below)
#   Cmd+Ctrl+W            close this space (herdr asks first; its sessions keep running)
#   Cmd+Ctrl+R            rename this space (the project's name; the project keeps its slug)
new_workspace      = "alt+n"
previous_workspace = "ctrl+alt+up"
next_workspace     = "ctrl+alt+down"
close_workspace    = "ctrl+alt+w"
rename_workspace   = ["ctrl+alt+r", "prefix+shift+w"]

# Panes: Cmd+D / Cmd+Shift+D split, Cmd+Shift+arrows focus, Cmd+Opt+arrows swap, Cmd+Shift+Enter zoom,
# Cmd+R rename, Cmd+K clear, Cmd+F search. Resize is C-b and the arrows (Cmd+Ctrl+Up/Down walk the spaces).
split_vertical    = "alt+d"
split_horizontal  = "alt+shift+d"
focus_pane_left   = "alt+left"
focus_pane_down   = "alt+down"
focus_pane_up     = "alt+up"
focus_pane_right  = "alt+right"
swap_pane_left    = "ctrl+shift+left"
swap_pane_down    = "ctrl+shift+down"
swap_pane_up      = "ctrl+shift+up"
swap_pane_right   = "ctrl+shift+right"
resize_pane_left  = "prefix+left"
resize_pane_down  = "prefix+down"
resize_pane_up    = "prefix+up"
resize_pane_right = "prefix+right"
zoom              = ["prefix+z", "alt+z"]
close_pane        = ["prefix+x", "alt+w"]
rename_pane       = "alt+r"
clear_pane        = "alt+k"
copy_mode         = ["prefix+[", "alt+/"]

# herdr has no action for moving a space, so two detached commands do it over its socket.
[[keys.command]]
key = "ctrl+alt+shift+up"
type = "shell"
command = "herdr-space move up"

[[keys.command]]
key = "ctrl+alt+shift+down"
type = "shell"
command = "herdr-space move down"

[ui]
tab_bar_position = "top"
sidebar_start_collapsed = false   # the sidebar is the live view of every agent's state
prompt_new_tab_name = false
prompt_new_workspace_name = false # a new space starts as a blank terminal; rename it when you like
mouse_capture = true
status_indicators = "dots"

# The dots are Claude's own state, drawn from `dot_*` tokens that `herdr-space follow` (started by `tw`) sets on
# each window and space: herdr's own dots can only show four fixed states, so the rows below leave out
# `state_icon` and draw these instead. Exactly one token has a value, and each has its own colour:
#   red     a prompt waits for you          yellow  finished, next steps for you
#   blue    running                         green   finished, nothing for you: filled until looked at, then hollow
[ui.sidebar.spaces]
rows = [[{ token = "$dot_prompt", fg = "#f38ba8" }, { token = "$dot_next", fg = "#f9e2af" },
         { token = "$dot_working", fg = "#89b4fa" }, { token = "$dot_new", fg = "#a6e3a1" },
         { token = "$dot_read", fg = "#a6e3a1" }, "workspace"], ["branch", "git_status"]]

[ui.sidebar.agents]
rows = [[{ token = "$dot_prompt", fg = "#f38ba8" }, { token = "$dot_next", fg = "#f9e2af" },
         { token = "$dot_working", fg = "#89b4fa" }, { token = "$dot_new", fg = "#a6e3a1" },
         { token = "$dot_read", fg = "#a6e3a1" }, "workspace", "tab"], ["agent"]]

# A herdr restart must not resume agent panes into their own conversation: the sessions belong to Claude's
# background daemon, and each window re-attaches with `claude attach`.
[session]
resume_agents_on_restore = false
