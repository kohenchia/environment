# ══════════════════════════════════════════════════════════════════════════
# tmux — project workspace with single-chord navigation
#
#   Tabs (windows) are projects.  Panes are tools: a shell, Claude Code, logs.
#
# Navigation is a single simultaneous chord (Cmd+1, Cmd+D) rather than a
# `C-b <key>` two-step.  tmux has no Super/Cmd modifier, so the terminal
# emulator translates each Cmd chord into an ESC-prefixed byte sequence and
# the bindings below catch it as `M-<key>` in the *root* key table, which
# needs no prefix at all.  See `local/alacritty.toml` for the sending side
# and `docs/tmux.md` for the full keymap.
#
# `C-b` stays bound as the escape hatch for everything not chorded.
# ══════════════════════════════════════════════════════════════════════════

# ── Base ──────────────────────────────────────────────────────────────────

# 10ms, not the 500ms default. Every chord arrives as ESC + key, so a long
# escape-time makes them feel laggy and confuses them with a real Escape.
set -sg escape-time 10

set -g mouse on
set -g base-index 1              # tabs start at 1, so Cmd+1 is the first tab
setw -g pane-base-index 1
set -g renumber-windows on       # closing a tab reflows the rest — no gaps
set -g set-clipboard on          # copy-mode yanks reach the system clipboard
set -g history-limit 50000
set -g focus-events on
setw -g mode-keys vi

# Tabs are projects, so their names must be stable — never let a shell or a
# program rename one out from under you. Rename deliberately with Cmd+Shift+R.
set -g allow-rename off
setw -g automatic-rename off

# tmux-256color lives in ncurses-term, which minimal Linux/WSL images omit;
# naming a terminal with no terminfo entry breaks colour and key decoding.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'

# `terminal-features` arrived in tmux 3.2. Older tmux (Ubuntu 20.04, Debian 11)
# errors out on an unknown option, so fall back to the 2.x-era equivalent.
if-shell '[ "$(printf "%s\n3.2\n" "$(tmux -V | cut -d" " -f2 | tr -d "a-z")" | sort -V | head -1)" = "3.2" ]' \
    'set -as terminal-features ",alacritty*:RGB:usstyle" ; set -as terminal-features ",xterm-256color:RGB"' \
    'set -ga terminal-overrides ",alacritty*:Tc,xterm-256color:Tc"'

# ── Retired bindings ──────────────────────────────────────────────────────
#
# `source-file` adds and replaces bindings but never removes them, so a server
# that loaded an older version of this file keeps its retired keys until told
# otherwise. Anything dropped from this config gets an explicit unbind here.
#
# M-f used to be scrollback search (now M-/). It has to stay unbound so that
# Option+Right's ESC f reaches the shell as forward-word.
unbind -n M-f

# ── Tabs = projects ───────────────────────────────────────────────────────

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 last-window          # Cmd+0 → most recent tab, not "tab 10"

# New tab in the same directory, named after it (a project name, not "zsh")
bind -n M-t new-window -c "#{pane_current_path}" -n "#{b:pane_current_path}"

bind -n M-S-Left  previous-window
bind -n M-S-Right next-window

bind -n C-M-S-Left  swap-window -d -t -1     # reorder the tab itself
bind -n C-M-S-Right swap-window -d -t +1

bind -n M-R command-prompt -I "#W" "rename-window '%%'"
bind -n M-W confirm-before -p "kill tab #W? (y/n)" kill-window

# ── Panes = tools ─────────────────────────────────────────────────────────

bind -n M-d split-window -h -c "#{pane_current_path}"   # Cmd+D       → right
bind -n M-D split-window -v -c "#{pane_current_path}"   # Cmd+Shift+D → below

bind -n M-Left  select-pane -L           # Cmd+Shift+arrows, in every direction
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Cmd+Opt+arrows — move the pane itself rather than the focus. The {left-of}
# style targets do the directional work; plain `swap-pane -U/-D` would only
# walk the pane index order, which doesn't match what you see on screen.
bind -n C-S-Left  swap-pane -t '{left-of}'
bind -n C-S-Right swap-pane -t '{right-of}'
bind -n C-S-Up    swap-pane -t '{up-of}'
bind -n C-S-Down  swap-pane -t '{down-of}'

bind -nr C-M-Left  resize-pane -L 5      # -r: hold the chord to keep resizing
bind -nr C-M-Right resize-pane -R 5
bind -nr C-M-Up    resize-pane -U 3
bind -nr C-M-Down  resize-pane -D 3

bind -n M-z resize-pane -Z               # Cmd+Shift+Enter → zoom toggle
bind -n M-Space next-layout              # Cmd+Shift+Space
bind -n M-w confirm-before -p "kill pane #P? (y/n)" kill-pane

# Cmd+R — name this pane, which is what the border label shows. Handy for
# marking a pane as `claude`, since Claude Code reports itself as `node`.
bind -n M-r command-prompt -I "#{pane_title}" "select-pane -T '%%'"

# ── Terminal parity ───────────────────────────────────────────────────────

# Cmd+K — clear the pane and drop its scrollback, then redraw the prompt
bind -n M-k send-keys -R \; clear-history \; send-keys C-l

# Cmd+F — search the scrollback, iTerm-style. Deliberately on M-/ and not M-f:
# Option+Right sends ESC f for forward-word, so M-f and M-b must stay unbound
# here or word movement would never reach the shell or Claude Code.
bind -n M-/ copy-mode \; command-prompt -T search -p "(search up)" {
    send -X search-backward "%%%"
}

# Chords work while scrolled back too. The root table is *not* consulted in
# copy mode — copy-mode-vi wins — so tab and pane movement is repeated here.
bind -T copy-mode-vi M-1 select-window -t 1
bind -T copy-mode-vi M-2 select-window -t 2
bind -T copy-mode-vi M-3 select-window -t 3
bind -T copy-mode-vi M-4 select-window -t 4
bind -T copy-mode-vi M-5 select-window -t 5
bind -T copy-mode-vi M-6 select-window -t 6
bind -T copy-mode-vi M-7 select-window -t 7
bind -T copy-mode-vi M-8 select-window -t 8
bind -T copy-mode-vi M-9 select-window -t 9
bind -T copy-mode-vi M-0 last-window
bind -T copy-mode-vi M-Left  select-pane -L
bind -T copy-mode-vi M-Right select-pane -R
bind -T copy-mode-vi M-Up    select-pane -U
bind -T copy-mode-vi M-Down  select-pane -D
bind -T copy-mode-vi M-S-Left  previous-window
bind -T copy-mode-vi M-S-Right next-window

# ── Chord off-switch (Cmd+Shift+B) ────────────────────────────────────────
#
# Root-table chords are global: they never reach the program in the pane.
# That's the point, but it breaks a nested tmux over ssh, or any app that
# genuinely wants M-<key>. This parks every binding in the `off` table and
# turns the status bar red. The same chord brings it back.
#
# The restore side re-applies the configured status colours rather than using
# `set -u`, which would reset them to tmux's defaults instead of ours.

bind -n M-B \
    set prefix None \;\
    set key-table off \;\
    set status-style "bg=colour52,fg=colour223" \;\
    display-message "chords OFF — Cmd+Shift+B to re-enable" \;\
    refresh-client -S

bind -T off M-B \
    set -u prefix \;\
    set -u key-table \;\
    set status-style "bg=colour234,fg=colour245" \;\
    display-message "chords ON" \;\
    refresh-client -S

# ── Status line as a tab bar ──────────────────────────────────────────────
#
# Reads like a Ghostty/iTerm tab strip: session name on the left, tabs in the
# middle, clock on the right. Tabs are clickable — that comes free with mouse
# on (MouseDown1Status).

set -g status-position top
set -g status-interval 5
set -g status-style "bg=colour234,fg=colour245"
set -g status-left  "#[bg=colour109,fg=colour232,bold] #S #[bg=colour234,fg=colour245] "
set -g status-left-length 30
set -g status-right "#[fg=colour109]#{?window_zoomed_flag,ZOOM ,}#[fg=colour245]%H:%M "
set -g status-right-length 30

set -g window-status-separator ""
set -g window-status-format         " #I #W "
set -g window-status-current-format "#[bg=colour109,fg=colour232,bold] #I #W "
set -g window-status-activity-style "fg=colour179"

set -g message-style "bg=colour109,fg=colour232"
set -g pane-active-border-style "fg=colour109"
set -g pane-border-style "fg=colour238"

# Label each pane with the tool running in it. An explicitly set pane title
# wins; otherwise fall back to the running command. tmux seeds pane_title with
# the hostname rather than leaving it empty, so compare against host_short —
# testing `#{?pane_title,...}` would always be true and every border would
# just read the hostname.
setw -g pane-border-status top
setw -g pane-border-format " #{pane_index} #{?#{==:#{pane_title},#{host_short}},#{pane_current_command},#{pane_title}} "
