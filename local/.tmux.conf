# ══════════════════════════════════════════════════════════════════════════
# tmux — project workspace with single-chord navigation
#
#   Tabs (windows) are projects.  Panes are tools: a shell, Claude Code, logs.
#
# Navigation is a single simultaneous chord (Cmd+1, Cmd+D) rather than a
# `C-b <key>` two-step.  tmux has no Super/Cmd modifier, so the terminal
# emulator translates each Cmd chord into an ESC-prefixed byte sequence and
# the bindings below catch it as `M-<key>` in the *root* key table, which
# needs no prefix at all.  See `local/alacritty.toml` for the sending side
# and `docs/tmux.md` for the full keymap.
#
# `C-b` stays bound as the escape hatch for everything not chorded.
# ══════════════════════════════════════════════════════════════════════════

# ── Base ──────────────────────────────────────────────────────────────────

# 10ms, not the 500ms default. Every chord arrives as ESC + key, so a long
# escape-time makes them feel laggy and confuses them with a real Escape.
set -sg escape-time 10

set -g mouse on
set -g base-index 1              # tabs start at 1, so Cmd+1 is the first tab
setw -g pane-base-index 1
set -g renumber-windows on       # closing a tab reflows the rest — no gaps
set -g set-clipboard on          # copy-mode yanks reach the system clipboard
set -g history-limit 50000
set -g focus-events on
setw -g mode-keys vi

# Tabs are projects, so their names must be stable — never let a shell or a
# program rename one out from under you. Rename deliberately with Cmd+Shift+R.
set -g allow-rename off
setw -g automatic-rename off

# tmux-256color lives in ncurses-term, which minimal Linux/WSL images omit;
# naming a terminal with no terminfo entry breaks colour and key decoding.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'

# `terminal-features`, `pane-border-indicators` and the `terminal` colour keyword
# all arrived in tmux 3.2, and older tmux (Ubuntu 20.04, Debian 11) errors out on
# an unknown option — so the true branch collects everything 3.2-only and the
# false branch the fallback. It also records the version test as `@tmux32` so the
# focus-dimming block near the end of this file can reuse it via `if -F` instead
# of running this shell pipeline a second time.
#
# pane-border-indicators off: colour the active pane's border all the way round
# rather than only half the shared edge in a two-pane window (tmux's default),
# now that the lit title bar already says which pane has focus.
if-shell '[ "$(printf "%s\n3.2\n" "$(tmux -V | cut -d" " -f2 | tr -d "a-z")" | sort -V | head -1)" = "3.2" ]' \
    'set -as terminal-features ",alacritty*:RGB:usstyle" ; set -as terminal-features ",xterm-256color:RGB" ; set -g pane-border-indicators off ; set -g @tmux32 1' \
    'set -ga terminal-overrides ",alacritty*:Tc,xterm-256color:Tc"'

# ── Retired bindings ──────────────────────────────────────────────────────
#
# `source-file` adds and replaces bindings but never removes them, so a server
# that loaded an older version of this file keeps its retired keys until told
# otherwise. Anything dropped from this config gets an explicit unbind here.
#
# M-f used to be scrollback search (now M-/). It has to stay unbound so that
# Option+Right's ESC f reaches the shell as forward-word.
unbind -n M-f

# ── Tabs = projects ───────────────────────────────────────────────────────

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 last-window          # Cmd+0 → most recent tab, not "tab 10"

# New tab in the same directory, named after it (a project name, not "zsh")
bind -n M-t new-window -c "#{pane_current_path}" -n "#{b:pane_current_path}"

bind -n M-S-Left  previous-window
bind -n M-S-Right next-window

bind -n C-M-S-Left  swap-window -d -t -1     # reorder the tab itself
bind -n C-M-S-Right swap-window -d -t +1

bind -n M-R command-prompt -I "#W" "rename-window '%%'"
bind -n M-W confirm-before -p "kill tab #W? (y/n)" kill-window

# ── Panes = tools ─────────────────────────────────────────────────────────

bind -n M-d split-window -h -c "#{pane_current_path}"   # Cmd+D       → right
bind -n M-D split-window -v -c "#{pane_current_path}"   # Cmd+Shift+D → below

bind -n M-Left  select-pane -L           # Cmd+Shift+arrows, in every direction
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Cmd+Opt+arrows — move the pane itself rather than the focus. The {left-of}
# style targets do the directional work; plain `swap-pane -U/-D` would only
# walk the pane index order, which doesn't match what you see on screen.
bind -n C-S-Left  swap-pane -t '{left-of}'
bind -n C-S-Right swap-pane -t '{right-of}'
bind -n C-S-Up    swap-pane -t '{up-of}'
bind -n C-S-Down  swap-pane -t '{down-of}'

bind -nr C-M-Left  resize-pane -L 5      # -r: hold the chord to keep resizing
bind -nr C-M-Right resize-pane -R 5
bind -nr C-M-Up    resize-pane -U 3
bind -nr C-M-Down  resize-pane -D 3

bind -n M-z resize-pane -Z               # Cmd+Shift+Enter → zoom toggle
bind -n M-Space next-layout              # Cmd+Shift+Space
bind -n M-w confirm-before -p "kill pane #P? (y/n)" kill-pane

# Cmd+R — name this pane, which is what the border label shows. Handy for
# marking a pane as `claude`, since Claude Code reports itself as `node`.
bind -n M-r command-prompt -I "#{pane_title}" "select-pane -T '%%'"

# ── Terminal parity ───────────────────────────────────────────────────────

# Cmd+K — clear the pane and drop its scrollback, then redraw the prompt
bind -n M-k send-keys -R \; clear-history \; send-keys C-l

# Cmd+F — search the scrollback, iTerm-style. Deliberately on M-/ and not M-f:
# Option+Right sends ESC f for forward-word, so M-f and M-b must stay unbound
# here or word movement would never reach the shell or Claude Code.
bind -n M-/ copy-mode \; command-prompt -T search -p "(search up)" {
    send -X search-backward "%%%"
}

# Chords work while scrolled back too. The root table is *not* consulted in
# copy mode — copy-mode-vi wins — so tab and pane movement is repeated here.
bind -T copy-mode-vi M-1 select-window -t 1
bind -T copy-mode-vi M-2 select-window -t 2
bind -T copy-mode-vi M-3 select-window -t 3
bind -T copy-mode-vi M-4 select-window -t 4
bind -T copy-mode-vi M-5 select-window -t 5
bind -T copy-mode-vi M-6 select-window -t 6
bind -T copy-mode-vi M-7 select-window -t 7
bind -T copy-mode-vi M-8 select-window -t 8
bind -T copy-mode-vi M-9 select-window -t 9
bind -T copy-mode-vi M-0 last-window
bind -T copy-mode-vi M-Left  select-pane -L
bind -T copy-mode-vi M-Right select-pane -R
bind -T copy-mode-vi M-Up    select-pane -U
bind -T copy-mode-vi M-Down  select-pane -D
bind -T copy-mode-vi M-S-Left  previous-window
bind -T copy-mode-vi M-S-Right next-window

# ── Chord off-switch (Cmd+Shift+B) ────────────────────────────────────────
#
# Root-table chords are global: they never reach the program in the pane.
# That's the point, but it breaks a nested tmux over ssh, or any app that
# genuinely wants M-<key>. This parks every binding in the `off` table and
# turns the status bar red. The same chord brings it back.
#
# The restore side re-applies the configured status colours rather than using
# `set -u`, which would reset them to tmux's defaults instead of ours.

bind -n M-B \
    set prefix None \;\
    set key-table off \;\
    set status-style "bg=colour52,fg=colour223" \;\
    display-message "chords OFF — Cmd+Shift+B to re-enable" \;\
    refresh-client -S

bind -T off M-B \
    set -u prefix \;\
    set -u key-table \;\
    set status-style "bg=colour234,fg=colour245" \;\
    display-message "chords ON" \;\
    refresh-client -S

# ── Status line as a tab bar ──────────────────────────────────────────────
#
# Reads like a Ghostty/iTerm tab strip: session name on the left, tabs in the
# middle, clock on the right. Tabs are clickable — that comes free with mouse
# on (MouseDown1Status).
#
# Focus is signalled by hue, not just brightness: the window layer is green and
# the pane layer is yellow, so the two "where am I" cues can never be read as
# the same thing. Within the green, two shades separate context from selection —
# the session chip is the darker sage (colour65) and the tab you're on is the
# bright green (colour77). Text on both is colour232, near-black, which is what
# keeps them legible at full saturation.

set -g status-position top
set -g status-interval 5
set -g status-style "bg=colour234,fg=colour245"
set -g status-left  "#[bg=colour65,fg=colour232,bold] #S #[bg=colour234,fg=colour245] "
set -g status-left-length 30
set -g status-right "#[fg=colour77]#{?window_zoomed_flag,ZOOM ,}#[fg=colour245]%H:%M "
set -g status-right-length 30

set -g window-status-separator ""
set -g window-status-format         " #I #W "
set -g window-status-current-format "#[bg=colour77,fg=colour232,bold] #I #W "

# Activity is deliberately outside both accent hues: a green-ish flag on an
# unfocused tab would read as a second, half-lit selection.
set -g window-status-activity-style "fg=colour109"

set -g message-style "bg=colour77,fg=colour232"

# ── Pane titles ───────────────────────────────────────────────────────────
#
# The focused pane wears a lit title bar across its full width and a bright
# border line; every other pane gets a dim label sitting on a thin grey line.
# The accent here is yellow (colour178) against the status line's green, so the
# pane you're in and the tab you're on never read as the same signal.
#
# tmux has no "fill this row" primitive for pane borders, and a bg on
# pane-active-border-style would tint all four sides of the frame rather than
# just the top. So the active label pads itself out past any real terminal
# width, tmux clips the overflow at the pane's edge, and the padding's own
# background is what paints the bar. Only the active branch is padded: those
# trailing spaces overwrite the border line, which is the whole point for the
# lit pane but would blank the line for a dim one.
#
# Two non-obvious things about `#{pN:…}`, both verified against tmux 3.5a:
#
#   * The direction is the reverse of what the manual says. `p400` pads on the
#     right, leaving the text left-aligned; `p-400` right-justifies it.
#   * The width must be a literal. `#{p#{pane_width}:…}` expands to nothing at
#     all, which is why this pads to a fixed 400 and leans on clipping instead
#     of measuring the pane.

set -g pane-active-border-style "fg=colour178"
set -g pane-border-style "fg=colour238"

# The label, written once. An explicitly set pane title wins; otherwise fall
# back to the running command. tmux seeds pane_title with the hostname rather
# than leaving it empty, so that's what "unnamed" is compared against — testing
# `#{?pane_title,…}` would always be true and every label would read the
# hostname. It has to be `#{host}`, not `#{host_short}`: the seed is the full
# name, so on this machine `host_short` gives Kohens-MacBook-Pro against a
# pane_title of Kohens-MacBook-Pro.local, never matches, and every unnamed pane
# is labelled with the machine instead of the command running in it.
#
# Note that anything setting the terminal title (OSC 0/2) sets pane_title too,
# and tmux can't refuse it — Claude Code puts its session name there, so that
# pane self-labels rather than reading `node`. Name a pane deliberately with
# Cmd+R (`logs`, `server`) when its command isn't descriptive enough.
set -g @pane_label " #{pane_index} · #{?#{==:#{pane_title},#{host}},#{pane_current_command},#{pane_title}} "

# `#{E:…}` expands a user option's contents as a format, so both branches can
# reuse the label above. Each style is its own `#[…]` tag on purpose: a comma
# inside one (`#[fg=colour232,bold]`) would read as the argument separator of
# the enclosing `#{?…}` and split the format in the wrong place.
setw -g pane-border-format "#{?pane_active,#[bg=colour178]#[fg=colour232]#[bold]#{p400:#{E:@pane_label}},#[fg=colour245]#{E:@pane_label}}"

# Label panes only when there's more than one to tell apart. The status line
# already sits at the top, so a lit bar directly beneath it in a single-pane
# window reads as a doubled header — and a lone pane has no sibling to be
# distinguished from. Drop these two lines to label every pane always.
setw -g pane-border-status off
set-hook -g window-layout-changed "if -F '#{==:#{window_panes},1}' 'setw pane-border-status off' 'setw pane-border-status top'"

# ── Unfocused panes recede ────────────────────────────────────────────────
#
# Unfocused panes sit on a lighter grey with muted text, so the focused pane
# reads as the one hole you're working in rather than one panel among equals.
#
# The active pane must say `terminal`, not `default`. In a tmux style `default`
# means *inherit*, and what the active pane inherits from is `window-style` — the
# grey below — so `bg=default` here silently greys out the focused pane too.
# `terminal` is the terminal's own background, which is what leaves the focused
# pane looking untouched and keeps any future window opacity working. It needs
# tmux 3.2+; older tmux has no way to say "the real background" once
# window-style is set, so it falls back to pinning a near-black.
#
# The greys are pitched against Alacritty's default background of #1d1f21:
# colour237 (#3a3a3a) is far enough above it to register at a glance, where
# something like colour235 (#262626) is close enough that every pane just looks
# uniformly grey.
#
# This paints only where a program hasn't painted its own background. Anything
# that fills its screen — vim with a colorscheme, say — covers its whole pane
# and the grey won't show there.

if -F '#{@tmux32}' \
    'set -g window-active-style "fg=terminal,bg=terminal"' \
    'set -g window-active-style "fg=colour250,bg=colour232"'

set -g window-style "fg=colour246,bg=colour237"
